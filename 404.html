<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Third Burner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07070d; --ink: #eef0ff; --muted: #8d91ab; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 16px; text-align: center; background: radial-gradient(50% 50% at 50% 30%, rgba(255,79,134,.18), transparent 70%), var(--bg); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif; }
  .code { font: 400 13px/1 "JetBrains Mono", monospace; color: #ff7a3d; text-shadow: 0 0 10px rgba(255,122,61,.7); }
  h1 { margin: 14px 0 10px; font-size: clamp(36px, 7vw, 64px); letter-spacing: -0.04em; line-height: 1; text-shadow: 0 0 30px rgba(255,79,134,.45); }
  p { margin: 0 0 24px; color: var(--muted); }
  a { display: inline-block; padding: 10px 18px; border: 1px solid rgba(255,122,61,.5); border-radius: 999px; color: var(--ink); text-decoration: none; transition: box-shadow 200ms ease-out, border-color 200ms ease-out; }
  a:hover { border-color: #ff7a3d; box-shadow: 0 0 24px rgba(255,122,61,.3); }
  :focus-visible { outline: 2px solid #ff7a3d; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="code">404 · nothing on this burner</div>
    <h1>Page not found</h1>
    <p>That page doesn't exist, or it moved.</p>
    <a href="/">Back to Third Burner</a>
  </main>
</body>
</html>
